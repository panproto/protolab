# cargo-deny configuration for protolab.
#
# Mirrors the policy of its primary upstream (panproto/panproto) so that a
# license or advisory drift in the dependency graph is caught at CI time
# rather than at release time.
#
# Run `cargo deny check` locally after changing dependencies. CI runs the
# same check; see `.github/workflows/ci.yml`.

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # paste is unmaintained (RUSTSEC-2024-0436) but is a transitive dep of
    # nickel-lang-core used only at Nickel evaluation time (not in hot paths).
    # No security impact; will be resolved when nickel-lang updates.
    "RUSTSEC-2024-0436",
    # bitmaps is unmaintained (RUSTSEC-2026-0247, archived 2026-05-03) and
    # reaches us the same way paste does: bitmaps -> imbl-sized-chunks ->
    # nickel-lang-vector -> nickel-lang -> panproto-dsl-eval. It is a bitset
    # data structure with no reported vulnerability, and the advisory itself
    # records "no safe upgrade is available", so there is nothing to move to
    # until nickel-lang changes what it depends on. Not introduced by any
    # protolab change: the crate is in main's lockfile too, and this became a
    # CI failure when the advisory landed in the database rather than when
    # the dependency did.
    "RUSTSEC-2026-0247",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CDLA-Permissive-2.0",
    # malachite crates are transitive deps of nickel-lang (arbitrary-precision
    # arithmetic in the Nickel evaluator). Combined under LGPL-3.0 Section 4;
    # see `NOTICE` for the full carve-out explanation.
    "LGPL-3.0-only",
]

[bans]
multiple-versions = "warn"
# Wildcards are allowed because both kinds of "wildcard" dependency
# protolab uses are version-pinned by a different mechanism than a
# semver range:
#
#   1. Our internal crates (`protolab-{schema,core,eval,wasm}`) use
#      `[dependencies] foo.workspace = true` with path-based workspace
#      entries. `allow-wildcard-paths = true` covers those.
#   2. Upstream `panproto-*` crates are pulled by git tag (`tag = "v0.27.3"`)
#      rather than a version range. cargo-deny flags these as wildcards
#      because the Cargo.toml entry carries no version field, but the git
#      tag pins them just as tightly as a crates.io version would.
#
# If we ever move to crates.io-published panproto, tighten this back to
# `wildcards = "deny"` and drop the per-crate overrides below.
wildcards = "allow"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/panproto/panproto.git",
]
