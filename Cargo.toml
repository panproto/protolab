[workspace]
members = [
    "crates/protolab-schema",
    "crates/protolab-core",
    "crates/protolab-eval",
    "crates/protolab-wasm",
]
resolver = "2"

[workspace.package]
version = "0.6.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/panproto/protolab"

[workspace.dependencies]
panproto-schema = { git = "https://github.com/panproto/panproto.git", tag = "v0.38.0" }
panproto-gat = { git = "https://github.com/panproto/panproto.git", tag = "v0.38.0" }
panproto-lens = { git = "https://github.com/panproto/panproto.git", tag = "v0.38.0" }
panproto-lens-dsl = { git = "https://github.com/panproto/panproto.git", tag = "v0.38.0" }
panproto-protocols = { git = "https://github.com/panproto/panproto.git", tag = "v0.38.0" }
panproto-inst = { git = "https://github.com/panproto/panproto.git", tag = "v0.38.0" }
panproto-check = { git = "https://github.com/panproto/panproto.git", tag = "v0.38.0" }
panproto-mig = { git = "https://github.com/panproto/panproto.git", tag = "v0.38.0" }
panproto-expr = { git = "https://github.com/panproto/panproto.git", tag = "v0.38.0" }
panproto-expr-parser = { git = "https://github.com/panproto/panproto.git", tag = "v0.38.0" }
panproto-core = { git = "https://github.com/panproto/panproto.git", tag = "v0.38.0" }
panproto-theory-dsl = { git = "https://github.com/panproto/panproto.git", tag = "v0.38.0" }

# Internal crates
protolab-schema = { path = "crates/protolab-schema" }
protolab-core = { path = "crates/protolab-core" }
protolab-eval = { path = "crates/protolab-eval" }

# WASM
wasm-bindgen = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
smallvec = { version = "2.0.0-alpha.12", features = ["serde"] }

# Error handling
thiserror = "2"
