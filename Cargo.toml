[workspace]
members = [
    "crates/protolab-schema",
    "crates/protolab-core",
    "crates/protolab-eval",
    "crates/protolab-wasm",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/panproto/protolab"

[workspace.dependencies]
# panproto v0.27.3 (includes the nest_field combinator fix panproto#23
# AND the wtype_restrict node-synthesis fix for nest_field forward eval,
# panproto#24).
panproto-schema = { git = "https://github.com/panproto/panproto.git", tag = "v0.27.3" }
panproto-gat = { git = "https://github.com/panproto/panproto.git", tag = "v0.27.3" }
panproto-lens = { git = "https://github.com/panproto/panproto.git", tag = "v0.27.3" }
panproto-lens-dsl = { git = "https://github.com/panproto/panproto.git", tag = "v0.27.3" }
panproto-protocols = { git = "https://github.com/panproto/panproto.git", tag = "v0.27.3" }
panproto-inst = { git = "https://github.com/panproto/panproto.git", tag = "v0.27.3" }
panproto-check = { git = "https://github.com/panproto/panproto.git", tag = "v0.27.3" }
panproto-mig = { git = "https://github.com/panproto/panproto.git", tag = "v0.27.3" }
panproto-expr = { git = "https://github.com/panproto/panproto.git", tag = "v0.27.3" }
panproto-expr-parser = { git = "https://github.com/panproto/panproto.git", tag = "v0.27.3" }
panproto-core = { git = "https://github.com/panproto/panproto.git", tag = "v0.27.3" }
panproto-theory-dsl = { git = "https://github.com/panproto/panproto.git", tag = "v0.27.3" }

# Internal crates
protolab-schema = { path = "crates/protolab-schema" }
protolab-core = { path = "crates/protolab-core" }
protolab-eval = { path = "crates/protolab-eval" }

# WASM
wasm-bindgen = "0.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
smallvec = { version = "2.0.0-alpha.12", features = ["serde"] }

# Error handling
thiserror = "2"
