name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked

  license:
    name: License gate (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  wasm:
    name: Build WASM pkg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - name: Build protolab-wasm
        run: ./scripts/build-wasm.sh
      - name: Upload wasm pkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: protolab-wasm-pkg
          path: app/src/wasm/pkg
          retention-days: 7

  frontend:
    name: Frontend (vitest + tsc)
    runs-on: ubuntu-latest
    needs: wasm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json
      - name: Download wasm pkg artifact
        uses: actions/download-artifact@v4
        with:
          name: protolab-wasm-pkg
          path: app/src/wasm/pkg
      - name: Install deps
        working-directory: app
        run: npm ci
      - name: Type-check (prod)
        working-directory: app
        run: npx tsc --noEmit
      - name: Type-check (test)
        working-directory: app
        run: npx tsc --noEmit -p tsconfig.test.json
      - name: Vitest
        working-directory: app
        run: npm test

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: wasm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json
      - name: Download wasm pkg artifact
        uses: actions/download-artifact@v4
        with:
          name: protolab-wasm-pkg
          path: app/src/wasm/pkg
      - name: Install deps
        working-directory: app
        run: npm ci
      - name: Install Playwright browsers
        working-directory: app
        run: npx playwright install chromium --with-deps
      - name: Playwright
        working-directory: app
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7
