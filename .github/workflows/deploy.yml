name: Deploy to GitHub Pages

# Deploys the built Vite app to GitHub Pages on every push to `main`.
#
# URL: https://panproto.dev/protolab/
#
# How the custom-domain routing works:
#
# 1. `panproto/panproto.github.io` is the organisation's user site and
#    has its custom domain set to `panproto.dev` in its Pages settings.
# 2. Per GitHub's docs, when an organisation sets a custom domain on its
#    user/org site, that domain is inherited by every *project* Pages
#    site in the organisation at the corresponding subpath. So
#    `panproto/protolab`'s Pages site automatically serves at
#    `https://panproto.dev/protolab/` with no CNAME file needed in this
#    repository.
# 3. Vite is configured (see `app/vite.config.ts`) with `base: "/protolab/"`
#    in production so asset URLs are prefixed correctly.
#
# Reference: https://docs.github.com/en/pages/configuring-a-custom-domain-for-your-github-pages-site/about-custom-domains-and-github-pages#custom-domains-for-github-pages-sites

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the
# run in-progress and latest queued. However, don't cancel in-progress
# runs as we want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - name: Build WASM pkg
        run: ./scripts/build-wasm.sh
      - name: Install app deps
        working-directory: app
        run: npm ci
      - name: Build app
        working-directory: app
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
