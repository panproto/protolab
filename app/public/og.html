<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>protolab OG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       oklch(0.15 0.01 250);
    --bg-dark:  oklch(0.12 0.01 250);
    --grid:     oklch(0.24 0.01 250);
    --border:   oklch(0.30 0.01 250);
    --panel:    oklch(0.20 0.01 250);
    --text:     #e4e6ea;
    --muted:    #9aa0ab;
    --iso:      #4CAF50;
    --lens:     #2196F3;
    --prism:    #9C27B0;
    --traversal:#F44336;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    background: var(--bg);
    color: var(--text);
    position: relative;
  }

  /* Dot grid */
  .grid {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, var(--grid) 1.4px, transparent 1.4px);
    background-size: 28px 28px;
    background-position: 0 0;
  }
  /* subtle vignette so center nodes pop */
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 55%, transparent 35%, rgba(0,0,0,0.45) 100%);
    pointer-events: none;
  }

  /* SVG canvas for nodes+wires */
  .canvas { position: absolute; inset: 0; z-index: 2; }

  /* Hero wordmark + tagline (bottom-left) */
  .hero {
    position: absolute; left: 64px; bottom: 44px; z-index: 4;
    display: flex; flex-direction: column; gap: 10px;
  }
  .brand {
    display: flex; align-items: center; gap: 18px;
  }
  .brand .mark {
    display: flex; gap: 3px; align-items: stretch;
    width: 38px; height: 56px;
    background: #0c0b0a; border-radius: 9px; padding: 8px 6px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }
  .brand .mark span { display: block; border-radius: 2px; }
  .brand .mark .b1 { width: 8px;  background: #e63946; }
  .brand .mark .b2 { width: 10px; background: #e8a020; }
  .brand .mark .b3 { width: 6px;  background: #4a90d9; }
  .brand .word {
    font-weight: 700; font-size: 60px; line-height: 1.0;
    letter-spacing: -0.035em; color: var(--text);
  }
  .tagline {
    font-size: 20px; color: var(--muted);
    font-weight: 500; letter-spacing: 0;
    text-transform: lowercase;
  }
  .tagline em { font-style: normal; color: var(--text); }

</style>
</head>
<body>
  <div class="grid"></div>
  <div class="vignette"></div>

  <!-- Canvas: nodes + wires -->
  <svg class="canvas" width="1200" height="630" viewBox="0 0 1200 630" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- glow for selected node -->
      <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="4" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>

    <!-- WIRES (drawn first, under nodes) -->
    <!-- RenameField (ISO green) out -> MapItems (Traversal) in -->
    <path d="M 370 170 C 420 170, 400 260, 450 260"
          fill="none" stroke="#4CAF50" stroke-width="2.5" stroke-linecap="round"/>
    <!-- MapItems (Traversal red) out -> CoerceType (Lens) in — carries the inner lens step -->
    <path d="M 750 260 C 800 260, 780 170, 830 170"
          fill="none" stroke="#F44336" stroke-width="2.5" stroke-linecap="round"/>

    <!-- NODE: RenameField (ISO green) -->
    <g transform="translate(70, 110)">
      <rect width="300" height="120" rx="10" ry="10"
            fill="rgba(76,175,80,0.09)" stroke="#4CAF50" stroke-width="2"/>
      <!-- header -->
      <circle cx="22" cy="28" r="5.5" fill="#4CAF50"/>
      <text x="38" y="33" fill="#e4e6ea" font-family="JetBrains Mono, monospace"
            font-size="17" font-weight="600">RenameField</text>
      <!-- optic badge right -->
      <rect x="236" y="16" width="48" height="22" rx="4" fill="rgba(76,175,80,0.18)"/>
      <text x="260" y="31" text-anchor="middle" fill="#4CAF50"
            font-family="JetBrains Mono, monospace" font-size="10" font-weight="700"
            letter-spacing="0.08em">ISO</text>
      <!-- divider -->
      <line x1="16" y1="52" x2="284" y2="52" stroke="#2a2c36" stroke-width="1"/>
      <!-- params -->
      <text x="22" y="76" fill="#9aa0ab" font-family="JetBrains Mono, monospace" font-size="13">
        <tspan fill="#9aa0ab">old_name:</tspan> <tspan fill="#e4e6ea">id</tspan>
      </text>
      <text x="22" y="98" fill="#9aa0ab" font-family="JetBrains Mono, monospace" font-size="13">
        <tspan fill="#9aa0ab">new_name:</tspan> <tspan fill="#e4e6ea">userId</tspan>
      </text>
      <!-- ports -->
      <circle cx="0" cy="60" r="6" fill="#15161d" stroke="#4CAF50" stroke-width="2"/>
      <circle cx="300" cy="60" r="6" fill="#4CAF50" stroke="#4CAF50" stroke-width="2"/>
    </g>

    <!-- NODE: MapItems (Traversal red) — middle -->
    <g transform="translate(450, 200)">
      <rect width="300" height="120" rx="10" ry="10"
            fill="rgba(244,67,54,0.10)" stroke="#F44336" stroke-width="2"/>
      <circle cx="22" cy="28" r="5.5" fill="#F44336"/>
      <text x="38" y="33" fill="#e4e6ea" font-family="JetBrains Mono, monospace"
            font-size="17" font-weight="600">MapItems</text>
      <rect x="210" y="16" width="74" height="22" rx="4" fill="rgba(244,67,54,0.22)"/>
      <text x="247" y="31" text-anchor="middle" fill="#F44336"
            font-family="JetBrains Mono, monospace" font-size="10" font-weight="700"
            letter-spacing="0.08em">TRAVERSAL</text>
      <line x1="16" y1="52" x2="284" y2="52" stroke="#2a2c36" stroke-width="1"/>
      <text x="22" y="87" fill="#9aa0ab" font-family="JetBrains Mono, monospace" font-size="13">
        <tspan fill="#9aa0ab">focus:</tspan> <tspan fill="#e4e6ea">tags</tspan>
      </text>
      <circle cx="0" cy="60" r="6" fill="#F44336" stroke="#F44336" stroke-width="2"/>
      <circle cx="300" cy="60" r="6" fill="#F44336" stroke="#F44336" stroke-width="2"/>
    </g>

    <!-- NODE: CoerceType (Lens blue) — terminal, applied to each tag -->
    <g transform="translate(830, 110)">
      <rect width="300" height="120" rx="10" ry="10"
            fill="rgba(33,150,243,0.10)" stroke="#2196F3" stroke-width="2"/>
      <circle cx="22" cy="28" r="5.5" fill="#2196F3"/>
      <text x="38" y="33" fill="#e4e6ea" font-family="JetBrains Mono, monospace"
            font-size="17" font-weight="600">CoerceType</text>
      <rect x="226" y="16" width="58" height="22" rx="4" fill="rgba(33,150,243,0.20)"/>
      <text x="255" y="31" text-anchor="middle" fill="#2196F3"
            font-family="JetBrains Mono, monospace" font-size="10" font-weight="700"
            letter-spacing="0.08em">LENS</text>
      <line x1="16" y1="52" x2="284" y2="52" stroke="#2a2c36" stroke-width="1"/>
      <text x="22" y="76" fill="#9aa0ab" font-family="JetBrains Mono, monospace" font-size="13">
        <tspan fill="#9aa0ab">field:</tspan> <tspan fill="#e4e6ea">name</tspan>
      </text>
      <text x="22" y="98" fill="#9aa0ab" font-family="JetBrains Mono, monospace" font-size="13">
        <tspan fill="#9aa0ab">expr:</tspan>&#160; <tspan fill="#e4e6ea">trim</tspan>
      </text>
      <circle cx="0" cy="60" r="6" fill="#2196F3" stroke="#2196F3" stroke-width="2"/>
      <circle cx="300" cy="60" r="6" fill="#15161d" stroke="#2196F3" stroke-width="2"/>
    </g>

    <!-- HERO: brand mark + wordmark + tagline, anchored bottom-left -->
    <!-- tagline (eyebrow) -->
    <text x="64" y="455" fill="#9aa0ab" font-family="JetBrains Mono, monospace"
          font-size="20" font-weight="500" letter-spacing="0">a patchbay for your <tspan fill="#e4e6ea" font-weight="600">schemas</tspan>.</text>

    <!-- favicon bars mark -->
    <g transform="translate(64, 485)">
      <rect width="38" height="56" rx="9" fill="#0c0b0a"/>
      <rect x="7"  y="8" width="8"  height="40" rx="2" fill="#e63946"/>
      <rect x="17" y="8" width="10" height="40" rx="2" fill="#e8a020"/>
      <rect x="29" y="8" width="6"  height="40" rx="2" fill="#4a90d9"/>
    </g>

    <!-- wordmark -->
    <text x="118" y="530" fill="#e4e6ea"
          font-family="JetBrains Mono, monospace" font-size="56" font-weight="700"
          letter-spacing="-1.8">protolab</text>
  </svg>
</body>
</html>
